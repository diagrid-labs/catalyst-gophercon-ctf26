# Run on Diagrid (managed sidecar, managed workflow + agent-registry):
#   diagrid dev run -f catalyst.yaml --project <your-project>
version: 1
common:
  logLevel: info
  appLogDestination: console
  enableAppHealthCheck: false
apps:
  - appID: security-grid
    appDirPath: ./
    command: ["go", "run", "."]
    env:
      GOWORK: "off" # build this example standalone (ignore any parent go.work)
